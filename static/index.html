<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; }
    .sidebar { width: 240px; background: #f5f6f8; border-right: 1px solid #e2e4e8; display: flex; flex-direction: column; }
    .sidebar h1 { font-size: 15px; padding: 14px; color: #333; }
    #new-btn { margin: 0 12px 12px; padding: 8px; border: none; border-radius: 6px; background: #10a37f; color: #fff; cursor: pointer; font-size: 13px; }
    #new-btn:hover { background: #0d8a6a; }
    #session-list { list-style: none; overflow-y: auto; flex: 1; }
    #session-list li { padding: 10px 14px; cursor: pointer; font-size: 13px; color: #444; border-left: 3px solid transparent; display: flex; align-items: center; gap: 6px; }
    #session-list li:hover { background: #ececf0; }
    #session-list li.active { background: #fff; border-left-color: #10a37f; font-weight: 600; }
    #session-list li .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9ccd1; flex-shrink: 0; }
    #session-list li .dot.live { background: #10a37f; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.65); } }
    #session-list li .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #session-list li .del { visibility: hidden; color: #bbb; font-size: 13px; padding: 0 2px; }
    #session-list li:hover .del { visibility: visible; }
    #session-list li .del:hover { color: #e5484d; }
    .chat { flex: 1; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; padding: 20px; }
    /* 每个会话一个视图；切换会话只改显隐，在途的流式输出不会被打断 */
    .session-view { display: block; }
    .msg { margin-bottom: 14px; max-width: 80%; }
    .msg .who { font-size: 12px; color: #999; margin-bottom: 3px; }
    .msg .bubble { padding: 10px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { margin-left: auto; }
    .msg.user .bubble { background: #10a37f; color: #fff; }
    .msg.assistant .bubble { background: #f0f0f3; color: #222; }
    .msg .bubble.thinking { color: #999; font-style: italic; }
    #img-preview { display: flex; gap: 6px; padding: 8px 14px 0; flex-wrap: wrap; }
    #img-preview img, .msg.user .bubble img { max-width: 72px; max-height: 72px; border-radius: 6px; display: block; margin-top: 6px; }
    #composer { display: flex; align-items: center; padding: 14px; border-top: 1px solid #e2e4e8; }
    #img-btn { padding: 0 8px; border: none; background: transparent; font-size: 20px; cursor: pointer; }
    #input { flex: 1; padding: 10px 12px; border: 1px solid #d0d3d8; border-radius: 8px; font-size: 14px; outline: none; margin-left: 6px; }
    #input:focus { border-color: #10a37f; }
    #count { font-size: 11px; color: #999; padding: 0 6px; white-space: nowrap; }
    #count.over { color: #e5484d; font-weight: 600; }
    #send-btn { margin-left: 4px; padding: 10px 18px; border: none; border-radius: 8px; background: #10a37f; color: #fff; cursor: pointer; min-width: 92px; }
    #send-btn:disabled { background: #b5d9cd; cursor: not-allowed; }
  </style>
  <script src="/static/marked.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <h1>Agent</h1>
    <button id="new-btn">＋ 新建会话</button>
    <ul id="session-list"></ul>
  </aside>

  <main class="chat">
    <div id="messages"></div>
    <div id="img-preview"></div>
    <form id="composer">
      <button id="img-btn" type="button" title="上传图片">🖼️</button>
      <input id="input" placeholder="输入消息，回车发送" autocomplete="off">
      <span id="count"></span>
      <button id="send-btn" type="submit">发送</button>
      <input id="file-input" type="file" accept="image/*" multiple hidden>
    </form>
  </main>

  <script>
    let currentSessionId = null;
    let pendingImages = [];
    const views = new Map();        // 会话id -> 该会话的视图 <div>（切窗口不销毁）
    const generating = new Set();   // 本窗口正在生成回复的会话id

    // 单次输入上限。启动时从 /health 读后端的真实值——服务端才是那道边界
    // （CLI 和直接 curl 也走它），前端这一层只是即时反馈，别各写一份。
    let MAX_INPUT = null;
    let MAX_IMAGES = null;
    let MAX_IMAGE_BYTES = null;

    function applyInputLimit() {
      if (MAX_INPUT == null) return;
      $('#input').setAttribute('maxlength', MAX_INPUT);
      $('#input').title = '单次最多 ' + MAX_INPUT + ' 字。要处理长文档请放进 data/knowledge/ 走知识库检索。';
      updateCount();
    }

    // 字数提示 + 超限时禁用发送。接近上限才显示，避免平时占地方
    function updateCount() {
      const n = $('#input').value.length;
      const el = $('#count');
      if (MAX_INPUT == null) { el.textContent = ''; return; }
      if (n <= MAX_INPUT - 500) { el.textContent = n > 0 ? String(n) : ''; }
      else if (n <= MAX_INPUT) el.textContent = n + ' / ' + MAX_INPUT;
      else el.textContent = '上限 ' + MAX_INPUT + ' 字';
      el.classList.toggle('over', n > MAX_INPUT);
    }

    const $ = (sel) => document.querySelector(sel);
    const messagesEl = $('#messages');
    const listEl = $('#session-list');

    function escapeHtml(t) {
      const d = document.createElement('div');
      d.textContent = t || '';
      return d.innerHTML;
    }

    // 模型、RAG 和 MCP 都会产生不可信文本。marked 不负责过滤 HTML 或
    // javascript: 链接，因此只保留 Markdown 的文字格式和 http(s)/mailto 链接。
    // 用户上传的图片由独立的受控路径渲染，模型 Markdown 不允许再嵌图片。
    const markdownRenderer = window.marked ? new marked.Renderer() : null;
    if (markdownRenderer) {
      markdownRenderer.html = () => '';
      markdownRenderer.image = (_href, _title, text) => text;
      markdownRenderer.link = (href, _title, text) => {
        try {
          const url = new URL(href, window.location.origin);
          if (!['http:', 'https:', 'mailto:'].includes(url.protocol)) return text;
          return '<a href="' + escapeHtml(url.href) + '" target="_blank"'
            + ' rel="noopener noreferrer" referrerpolicy="no-referrer">' + text + '</a>';
        } catch (e) {
          return text;
        }
      };
    }

    function renderAssistant(t) {
      return markdownRenderer
        ? marked.parse(t || '', { renderer: markdownRenderer })
        : escapeHtml(t);
    }
    // 把非 2xx 响应读成一句人能看懂的话（后端 409 时 detail 就是"会话正在生成回复"）
    async function readError(resp) {
      try {
        const body = await resp.json();
        if (body.detail) return body.detail;
      } catch (e) { /* 非 JSON 响应 */ }
      return '请求失败（' + resp.status + '）';
    }

    // ---- 视图管理：一个会话一个视图，切换只改显隐 ----

    function viewFor(id) {
      let v = views.get(id);
      if (!v) {
        v = document.createElement('div');
        v.className = 'session-view';
        v.dataset.id = id;
        messagesEl.appendChild(v);
        views.set(id, v);
      }
      return v;
    }

    function showView(id) {
      views.forEach((v, sid) => { v.style.display = (sid === id) ? '' : 'none'; });
      viewFor(id).style.display = '';
      scrollToBottom();
    }

    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    function addBubble(view, who, text, images) {
      const div = document.createElement('div');
      div.className = 'msg ' + who;
      const label = document.createElement('div');
      label.className = 'who';
      label.textContent = who === 'user' ? '你' : 'AI';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (who === 'assistant') bubble.innerHTML = renderAssistant(text);
      else bubble.textContent = text;
      if (images && images.length) {
        for (const src of images) {
          const img = document.createElement('img');
          img.src = src;
          bubble.appendChild(img);
        }
      }
      div.appendChild(label);
      div.appendChild(bubble);
      view.appendChild(div);
      if (view.style.display !== 'none') scrollToBottom();
      return bubble;
    }

    // 用服务器上的历史重建视图。本窗口正在生成该会话时跳过——服务器快照里
    // 没有"在途的那一轮"，覆盖掉会看起来像被中断。
    async function refreshView(id, force) {
      const resp = await fetch('/api/sessions/' + id);
      if (!resp.ok) return null;
      const session = await resp.json();
      const v = viewFor(id);
      if (force || !generating.has(id)) {
        v.innerHTML = '';
        (session.messages || []).forEach((m) => addBubble(v, m.role, m.content));
      }
      return session;
    }

    async function loadSessions() {
      const resp = await fetch('/api/sessions');
      const sessions = await resp.json();
      listEl.innerHTML = '';
      sessions.forEach((s) => {
        const li = document.createElement('li');
        li.dataset.id = s.id;
        if (s.id === currentSessionId) li.className = 'active';
        const live = generating.has(s.id);

        const dot = document.createElement('span');
        dot.className = 'dot' + (live ? ' live' : '');
        dot.title = live ? '正在生成回复' : '';

        const title = document.createElement('span');
        title.className = 'title';
        const firstUser = (s.messages || []).find(m => m.role === 'user');
        title.textContent = (firstUser ? firstUser.content : '（空会话）').slice(0, 18);
        title.onclick = () => selectSession(s.id);

        const del = document.createElement('span');
        del.className = 'del';
        del.textContent = '✕';
        del.title = '删除会话';
        del.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };

        li.appendChild(dot);
        li.appendChild(title);
        li.appendChild(del);
        listEl.appendChild(li);
      });
    }

    async function deleteSession(id) {
      if (!confirm('删除该会话？此操作不可恢复。')) return;
      const resp = await fetch('/api/sessions/' + id, { method: 'DELETE' });
      if (!resp.ok) { alert(await readError(resp)); return; }
      const v = views.get(id);
      if (v) { v.remove(); views.delete(id); }
      if (id === currentSessionId) currentSessionId = null;
      await loadSessions();
      const sessions = await (await fetch('/api/sessions')).json();
      if (sessions.length) await selectSession(sessions[0].id);
      else await newSession();
    }

    async function selectSession(id) {
      currentSessionId = id;
      showView(id);
      refreshView(id);
      refreshComposer();
      loadSessions();
    }

    async function newSession() {
      const resp = await fetch('/api/sessions', { method: 'POST' });
      const session = await resp.json();
      await selectSession(session.id);
    }

    // 发送按钮状态跟随"当前会话是否在生成"以及"是否超出输入上限"，而不是全局
    function refreshComposer() {
      const busy = currentSessionId != null && generating.has(currentSessionId);
      const over = MAX_INPUT != null && $('#input').value.length > MAX_INPUT;
      const btn = $('#send-btn');
      btn.disabled = busy || over;
      btn.textContent = busy ? '生成中…' : (over ? '超出上限' : '发送');
      updateCount();
    }

    async function sendMessage(text) {
      const id = currentSessionId;
      const images = pendingImages;
      if (!id || generating.has(id) || (!text.trim() && !images.length)) return;
      if (MAX_INPUT != null && text.length > MAX_INPUT) {
        updateCount();                 // 保底：maxLength 之外的入口（如脚本调用）
        return;
      }
      generating.add(id);
      pendingImages = [];
      $('#img-preview').innerHTML = '';
      const view = viewFor(id);
      addBubble(view, 'user', text, images);
      const aiBubble = addBubble(view, 'assistant', '思考中…');
      aiBubble.classList.add('thinking');
      // 思考指示器：模型是 reasoning 模型，延迟是随机抖动的而不是「一直很慢」。
      // 实测（35 次真实调用，scripts/probe_empty_reply_real.py）中位 5~8s，
      // 10 次里有 2 次超过 36s，最久 78s。所以分两级升级文案：5s 时提示一次，
      // 30s 时给出真实上限——否则用户在 70 多秒里会以为程序死了去刷新页面。
      const _t1 = setTimeout(() => {
        if (aiBubble.classList.contains('thinking'))
          aiBubble.textContent = '模型正在思考，请稍候…';
      }, 5000);
      const _t2 = setTimeout(() => {
        if (aiBubble.classList.contains('thinking'))
          aiBubble.textContent = '模型这次想得很深，可能要等一会儿（最久见过一分多钟）…';
      }, 30000);
      const stopTimer = () => { clearTimeout(_t1); clearTimeout(_t2); };
      let rawText = '';
      $('#input').value = '';
      refreshComposer();
      loadSessions();

      try {
        const resp = await fetch('/api/sessions/' + id + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, images: images.length ? images : undefined }),
        });
        if (!resp.ok) {
          stopTimer();
          aiBubble.classList.remove('thinking');
          aiBubble.textContent = '⚠️ ' + await readError(resp);
          return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';
        let finished = false;
        while (!finished) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          let idx;
          while ((idx = buffer.indexOf('\n\n')) >= 0) {
            const event = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            for (const line of event.split('\n')) {
              if (!line.startsWith('data: ')) continue;
              const payload = line.slice(6);
              if (payload === '[DONE]') { finished = true; break; }
              try {
                const obj = JSON.parse(payload);
                if (obj.error) {
                  stopTimer();
                  aiBubble.classList.remove('thinking');
                  aiBubble.textContent = '⚠️ ' + obj.error;
                } else if (obj.status) {
                  // 工具调用进度：工具轮模型不产出正文，这段等待里用户只能看到
                  // 一个静止的「思考中…」，用它换成具体在做什么。
                  //
                  // 要点两条：
                  // 1) 用 textContent 而不是 innerHTML +=——它整体替换，所以已渲染的
                  //    半截正文（或上一个工具的提示）不会和新提示叠在一起。
                  // 2) 这里也走上面的 textContent = 这条路径，工具轮中途失败的
                  //    error 事件照样能把它干净覆盖掉（docs/16 §7.3）。
                  stopTimer();
                  aiBubble.classList.remove('thinking');
                  aiBubble.textContent = '🔧 ' + obj.status;
                  if (view.style.display !== 'none') scrollToBottom();
                } else if (obj.delta) {
                  stopTimer();
                  aiBubble.classList.remove('thinking');
                  rawText += obj.delta;
                  aiBubble.innerHTML = renderAssistant(rawText);
                  if (view.style.display !== 'none') scrollToBottom();
                }
              } catch (e) { /* 忽略半截 JSON */ }
            }
          }
        }
        if (!rawText && !aiBubble.classList.contains('thinking')) aiBubble.textContent = '（空回复）';
      } catch (err) {
        stopTimer();
        aiBubble.classList.remove('thinking');
        aiBubble.textContent = '⚠️ 网络错误：' + err;
      } finally {
        stopTimer();
        generating.delete(id);
        refreshComposer();
        loadSessions();
      }
    }

    $('#composer').addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage($('#input').value);
    });
    $('#input').addEventListener('input', () => { updateCount(); refreshComposer(); });
    $('#new-btn').onclick = newSession;

    function fileToDataUri(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
    $('#img-btn').onclick = () => $('#file-input').click();
    $('#file-input').addEventListener('change', async (e) => {
      for (const file of e.target.files) {
        try {
          if (MAX_IMAGES != null && pendingImages.length >= MAX_IMAGES) {
            alert('单条消息最多上传 ' + MAX_IMAGES + ' 张图片');
            break;
          }
          if (!['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type)) {
            alert('仅支持 JPEG、PNG、WebP 或 GIF 图片');
            continue;
          }
          if (MAX_IMAGE_BYTES != null && file.size > MAX_IMAGE_BYTES) {
            alert('单张图片不能超过 ' + Math.floor(MAX_IMAGE_BYTES / 1024 / 1024) + ' MiB');
            continue;
          }
          const dataUri = await fileToDataUri(file);
          pendingImages.push(dataUri);
          const img = document.createElement('img');
          img.src = dataUri;
          $('#img-preview').appendChild(img);
        } catch (err) { /* 忽略读取失败 */ }
      }
      e.target.value = '';
    });

    (async function init() {
      // 先问后端真实的输入上限，再决定 maxLength
      try {
        const h = await (await fetch('/health')).json();
        if (h.max_input_chars) MAX_INPUT = h.max_input_chars;
        if (h.max_images_per_message != null) MAX_IMAGES = h.max_images_per_message;
        if (h.max_image_bytes) MAX_IMAGE_BYTES = h.max_image_bytes;
      } catch (e) { /* 拿不到就不限制，服务端仍会挡 */ }
      applyInputLimit();

      const sessions = await (await fetch('/api/sessions')).json();
      if (sessions.length) await selectSession(sessions[0].id);
      else await newSession();
    })();

    // 别的窗口新建/删除会话时，侧栏也能看到（只刷新列表，不碰正在显示的历史）
    setInterval(() => { if (document.visibilityState === 'visible') loadSessions(); }, 5000);
  </script>
</body>
</html>
